# Field mapping configuration for input files
# This file allows users to map their input file column names to the required field names used by the model
# Users can customize the column names in their data files and map them here

# Geographic file field mappings
geo_file_mapping:
  # Required field mappings for geographic data
  # Map your column names to the required field names used by the model
  GISJOIN: "GISJOIN"  # Unique identifier for each block group
  GEOID: "GEOID"      # Unique identifier for each block group
  COUNTYFP: "COUNTYFP"  # County code
  TRACTCE: "TRACTCE"    # Tract code
  BLKGRPCE: "BLKGRPCE"  # Block group code
  ALAND: "ALAND"        # Land area
  geometry: "geometry"  # Geometry of the block group

# Population file field mappings
pop_file_mapping:
  # Required field mappings for population data
  # Map your column names to the required field names used by the model
  GISJOIN: "GISJOIN"    # Unique identifier for each block group
  # Population field - map your custom column name to AJWME001
  AJWME001: "AJWME001"  # Population count (map from your custom column name)

# Flood file field mappings
flood_file_mapping:
  # Required field mappings for flood data
  # Map your column names to the required field names used by the model
  GISJOIN: "GISJOIN"        # Unique identifier for each flood zone
  Shape_Area: "Shape_Area"  # Area of the flood zone
  fld_area: "fld_area"      # Area of the flood zone
  perc_fld_area: "perc_fld_area"  # Percentage of the flood zone

# Housing file field mappings
housing_file_mapping:
  # Required field mappings for housing data
  # Map your column names to the required field names used by the model
  GISJOIN: "GISJOIN"           # Unique identifier for each block group
  pop1990: "pop1990"           # Population in 1990
  mhi1990: "mhi1990"           # Median household income in 1990
  hhsize1990: "hhsize1990"     # Average household size in 1990
  coastdist: "coastdist"       # Distance to the coast
  cbddist: "cbddist"           # Distance to the CBD
  hhtrans1993: "hhtrans1993"   # Number of households in 1993
  salesprice1993: "salesprice1993"  # Sales price in 1993
  salespricesf1993: "salespricesf1993"  # Sales price per square foot in 1993

# Hedonic file field mappings
hedonic_file_mapping:
  # Required field mappings for hedonic regression data
  # Map your column names to the required field names used by the model
  GISJOIN: "GISJOIN"                    # Unique identifier for each block group
  N_MeanSqfeet: "N_MeanSqfeet"          # Normalized mean square feet
  N_MeanAge: "N_MeanAge"                # Normalized mean age
  N_MeanNoOfStories: "N_MeanNoOfStories"  # Normalized mean number of stories
  N_MeanFullBathNumber: "N_MeanFullBathNumber"  # Normalized mean number of full bathrooms
  N_perc_area_flood: "N_perc_area_flood"  # Normalized percentage of the block group in the flood zone
  residuals: "residuals"                # Residuals from hedonic regression

