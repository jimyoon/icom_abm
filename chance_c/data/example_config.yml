# Example configuration file for CHANCE ABM simulation
# This file shows how to configure the simulation with field mapping

# Simulation setup
simulation_name: "ABM_Baltimore_example"
scenario: "Baseline"
intervention: "Baseline"
start_year: 2018
n_years: 2

# Agent and housing parameters
agent_housing_aggregation: 10
household_size: 2.7
initial_vacancy: 0.20

# Population growth parameters
pop_growth_mode: "perc"
pop_growth_perc: 0.01

# Income growth parameters
inc_growth_mode: "random_agent_replication"
pop_growth_inc_perc: 0.90
inc_growth_perc: 0.05

# Building and movement parameters
bld_growth_perc: 0.01
perc_move: 0.10
perc_move_mode: "random"

# Housing choice parameters
house_budget_mode: "rhea"
house_choice_mode: "simple_avoidance_utility"
simple_anova_coefficients: [-121428, 294707, 130553, 128990, 154887, -500000]
simple_avoidance_perc: 0.95
budget_reduction_perc: 0.90

# Stock and pricing parameters
stock_increase_mode: "simple_perc"
stock_increase_perc: 0.05
housing_pricing_mode: "simple_perc"
price_increase_perc: 0.05

# File paths and data sources
block_group_sample_size: 10
zoning_mode: "simple_perc"
zoning_perc: 0.05
market_mode: "top_candidate"
landscape_name: "Baltimore"

# Input file paths
# Note: If not specified, these will default to the example data files included with the package
# You can override any of these paths to use your own data files
# geo_filename: "path/to/your/geo_file.shp"
# pop_filename: "path/to/your/pop_file.csv"
pop_fieldname: "AJWME001"
# flood_filename: "path/to/your/flood_file.csv"
# housing_filename: "path/to/your/housing_file.csv"
# hedonic_filename: "path/to/your/hedonic_file.csv"

# Field mapping configuration
# Set this to the path of your field mapping file if your data files use different column names
field_mapping_file: "data/example_field_mapping.yml"

