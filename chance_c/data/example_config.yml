# Example configuration file for CHANCE ABM simulation
# This file shows how to configure the simulation with field mapping

# Simulation setup
simulation_name: "ABM_Baltimore_example"
scenario: "Baseline"
intervention: "Baseline"
start_year: 2018
n_years: 2

# Agent and housing parameters
agent_housing_aggregation: 10
household_size: 2.7
initial_vacancy: 0.20

# Population growth parameters
pop_growth_mode: "perc"
pop_growth_perc: 0.01

# Income growth parameters
inc_growth_mode: "random_agent_replication"
pop_growth_inc_perc: 0.90
inc_growth_perc: 0.05

# Building and movement parameters
bld_growth_perc: 0.01
perc_move: 0.10
perc_move_mode: "random"

# Housing choice parameters
house_budget_mode: "rhea"
house_choice_mode: "simple_avoidance_utility"
simple_anova_coefficients: [-121428, 294707, 130553, 128990, 154887, -500000]
simple_avoidance_perc: 0.95
budget_reduction_perc: 0.90

# Stock and pricing parameters
stock_increase_mode: "simple_perc"
stock_increase_perc: 0.05
housing_pricing_mode: "simple_perc"
price_increase_perc: 0.05

# File paths and data sources
block_group_sample_size: 10
zoning_mode: "simple_perc"
zoning_perc: 0.05
market_mode: "top_candidate"
landscape_name: "Baltimore"

# Input file paths
# Note: If not specified, these will default to the example data files included with the package
# You can override any of these paths to use your own data files
# geo_filename: "path/to/your/geo_file.shp"
# pop_filename: "path/to/your/pop_file.csv"
# flood_filename: "path/to/your/flood_file.csv"
# housing_filename: "path/to/your/housing_file.csv"
# hedonic_filename: "path/to/your/hedonic_file.csv"

# Field mapping configurations
# These mappings allow you to use data files with different column names
# The format is: required_field_name: "your_column_name"
# If your data files use the standard column names, you can keep these as-is

# Geographic file field mappings
geo_file_mapping:
  GISJOIN: "GISJOIN"      # Unique identifier for each block group
  GEOID: "GEOID"          # Geographic identifier
  COUNTYFP: "COUNTYFP"    # County code
  TRACTCE: "TRACTCE"      # Tract code
  BLKGRPCE: "BLKGRPCE"    # Block group code
  ALAND: "ALAND"          # Land area
  geometry: "geometry"    # Geometry column

# Population file field mappings
pop_file_mapping:
  GISJOIN: "GISJOIN"      # Unique identifier for each block group
  AJWME001: "AJWME001"    # Population count

# Flood file field mappings
flood_file_mapping:
  GISJOIN: "GISJOIN"        # Unique identifier for each block group
  Shape_Area: "Shape_Area"  # Total area
  fld_area: "fld_area"      # Flood area
  perc_fld_area: "perc_fld_area"  # Percentage of area in flood zone

# Housing file field mappings
housing_file_mapping:
  GISJOIN: "GISJOIN"                    # Unique identifier for each block group
  pop1990: "pop1990"                    # Population in 1990
  mhi1990: "mhi1990"                    # Median household income in 1990
  hhsize1990: "hhsize1990"              # Average household size in 1990
  coastdist: "coastdist"                # Distance to coast
  cbddist: "cbddist"                    # Distance to CBD
  hhtrans1993: "hhtrans1993"            # Number of house transactions in 1993
  salesprice1993: "salesprice1993"      # Sales price in 1993
  salespricesf1993: "salespricesf1993"  # Sales price per square foot in 1993

# Hedonic file field mappings
hedonic_file_mapping:
  GISJOIN: "GISJOIN"                            # Unique identifier for each block group
  N_MeanSqfeet: "N_MeanSqfeet"                  # Normalized mean square feet
  N_MeanAge: "N_MeanAge"                        # Normalized mean age
  N_MeanNoOfStories: "N_MeanNoOfStories"        # Normalized mean number of stories
  N_MeanFullBathNumber: "N_MeanFullBathNumber"  # Normalized mean number of full bathrooms
  N_perc_area_flood: "N_perc_area_flood"        # Normalized percentage in flood zone
  residuals: "residuals"                        # Hedonic regression residuals

# Example with custom field mappings:
# If your data files use different column names, modify the mappings above.
# For example, if your geographic file uses "BLOCK_GROUP_ID" instead of "GISJOIN":
# geo_file_mapping:
#   GISJOIN: "BLOCK_GROUP_ID"
#   GEOID: "CENSUS_ID"
#   COUNTYFP: "COUNTY_CODE"
#   TRACTCE: "TRACT_CODE"
#   BLKGRPCE: "BLOCK_GROUP_CODE"
#   ALAND: "LAND_AREA"
#   geometry: "geom" 